<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Dream Academy - Instagram Post</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { margin: 0; padding: 0; background: #0D1B3E; }
  .wrapper {
    width: 1080px;
    height: 1080px;
    background: #0D1B3E;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  /* Amber accent bars */
  .bar-top, .bar-bottom {
    position: absolute;
    left: 0;
    right: 0;
    height: 6px;
    background: #E8962B;
  }
  .bar-top { top: 0; }
  .bar-bottom { bottom: 0; }
  /* Decorative oval rings */
  .ring {
    position: absolute;
    border: 2px solid rgba(232, 150, 43, 0.15);
    border-radius: 50%;
  }
  .ring-1 {
    width: 600px;
    height: 600px;
    top: -120px;
    right: -180px;
  }
  .ring-2 {
    width: 450px;
    height: 450px;
    bottom: -100px;
    left: -140px;
  }
  .ring-3 {
    width: 300px;
    height: 300px;
    top: 200px;
    left: -80px;
    border-color: rgba(232, 150, 43, 0.08);
  }
  .ring-4 {
    width: 200px;
    height: 200px;
    bottom: 180px;
    right: -40px;
    border-color: rgba(232, 150, 43, 0.1);
  }
  /* Content */
  .content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 60px;
  }
  .logo {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 36px;
    color: #FDF6EC;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .logo span {
    color: #E8962B;
  }
  .logo-divider {
    width: 60px;
    height: 3px;
    background: #E8962B;
    margin: 16px auto 50px;
  }
  .headline {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 72px;
    color: #FDF6EC;
    line-height: 1.15;
    margin-bottom: 24px;
    font-weight: normal;
  }
  .subtext {
    font-family: Helvetica, Arial, sans-serif;
    font-size: 28px;
    color: rgba(253, 246, 236, 0.75);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 60px;
  }
  .stats {
    font-family: Helvetica, Arial, sans-serif;
    font-size: 26px;
    color: #E8962B;
    letter-spacing: 2px;
    margin-bottom: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }
  .stats-divider {
    width: 4px;
    height: 4px;
    background: #E8962B;
    border-radius: 50%;
  }
  .cta {
    display: inline-block;
    background: #E8962B;
    color: #0D1B3E;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 24px;
    font-weight: bold;
    padding: 22px 60px;
    border-radius: 6px;
    letter-spacing: 1px;
  }
  /* SVG decorative rings */
  .svg-rings {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="wrapper">
  <div class="bar-top"></div>
  <div class="bar-bottom"></div>

  <svg class="svg-rings" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="950" cy="120" rx="280" ry="260" fill="none" stroke="rgba(232,150,43,0.12)" stroke-width="2"/>
    <ellipse cx="950" cy="120" rx="220" ry="200" fill="none" stroke="rgba(232,150,43,0.07)" stroke-width="1.5"/>
    <ellipse cx="130" cy="960" rx="240" ry="220" fill="none" stroke="rgba(232,150,43,0.12)" stroke-width="2"/>
    <ellipse cx="130" cy="960" rx="180" ry="160" fill="none" stroke="rgba(232,150,43,0.07)" stroke-width="1.5"/>
    <ellipse cx="-20" cy="400" rx="140" ry="130" fill="none" stroke="rgba(232,150,43,0.06)" stroke-width="1.5"/>
    <ellipse cx="1100" cy="700" rx="120" ry="110" fill="none" stroke="rgba(232,150,43,0.08)" stroke-width="1.5"/>
  </svg>

  <div class="content">
    <div class="logo">Dream <span>Academy</span></div>
    <div class="logo-divider"></div>
    <div class="headline">It&rsquo;s Never Too Late<br>to Graduate</div>
    <div class="subtext">Adult High School Diploma Program</div>
    <div class="stats">
      <span>500+ Graduates</span>
      <span class="stats-divider"></span>
      <span>93% Completion Rate</span>
    </div>
    <div class="cta">Call (804) 228-8200</div>
  </div>
</div>
</body>
</html>
